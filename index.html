<style>
/* Mobile-first app shell (max 480px): screens Vandaag / Plan / Fitness / Stats with a fixed bottom tab bar.
   Single deliberate dark theme, zone colours carry meaning (rustig, marathontempo, threshold, interval). */
:root{
  --bg:#0F1420; --card:#182033; --card2:#202A42; --ink:#F3F5FA; --muted:#8F9AB2; --line:#2A3552;
  --primary:#FF6B4A; --ok:#3FC98A;
  --zR:#5E6985; --zE:#3FC98A; --zMP:#5B8CFF; --zT:#FFA63D; --zI:#FF4F7B; --bike:#2EC4C4; --gym:#A47CFF;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit}
.app{max-width:480px;margin:0 auto;padding-block:16px calc(96px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.num{font-variant-numeric:tabular-nums}
.disp{font-family:var(--display);font-weight:700;letter-spacing:.01em}
.eyebrow{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
h1,h2,h3{margin:0;text-wrap:balance}
.card{background:var(--card);border-radius:18px;padding:16px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.muted{color:var(--muted)}
.small{font-size:13px}

/* top */
.top h1{font-family:var(--display);font-size:34px;font-weight:800;line-height:1;text-transform:uppercase}
.hero{position:relative;overflow:hidden;background:linear-gradient(150deg,#22305A 0%,#182033 55%,#1A1F33 100%);border-radius:22px;padding:18px}
.hero .big{font-family:var(--display);font-size:76px;font-weight:800;line-height:.85;color:var(--ink)}
.hero .big small{font-size:22px;font-weight:600;color:var(--muted);margin-left:6px}
.hero .route{position:absolute;right:-10px;top:-6px;width:170px;opacity:.35}
.hero .meta{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.hero .meta div{background:rgba(255,255,255,.06);border-radius:12px;padding:8px 10px}
.hero .meta b{display:block;font-family:var(--display);font-size:22px;line-height:1.1}
.hero .meta span{font-size:10px;white-space:nowrap;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}

/* week dots */
.dots{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dot{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--muted);background:none;border:0;padding:0;cursor:pointer}
.dot i{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);font-style:normal;font-weight:700;font-size:13px;color:var(--muted)}
.dot.has i{border-color:var(--muted)}
.dot.part i{border-color:var(--primary);color:var(--ink)}
.dot.done i{background:var(--ok);border-color:var(--ok);color:#0F1420}
.dot.today span{color:var(--ink);font-weight:800}
.dot.today i{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--primary)}
.dot:focus-visible i{outline:2px solid var(--primary);outline-offset:3px}

/* session card */
.sess{background:var(--card);border-radius:18px;padding:14px 14px 14px 16px;display:flex;flex-direction:column;gap:10px;position:relative;cursor:pointer;border:1px solid transparent;text-align:left;width:100%}
.sess:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.sess .kind{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}
.sess .kind::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.sess h3{font-size:19px;font-weight:800;line-height:1.2}
.facts{display:flex;gap:14px;font-size:14px;color:var(--muted)}
.facts b{color:var(--ink);font-weight:700}
.sess.isdone{opacity:.6}
.sess.isdone h3{text-decoration:line-through;text-decoration-thickness:2px}
.chk{position:absolute;right:12px;top:12px;width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:var(--card2);display:grid;place-items:center;cursor:pointer}
.chk svg{width:20px;height:20px;stroke:var(--muted)}
.chk[aria-pressed="true"]{background:var(--ok);border-color:var(--ok)}
.chk[aria-pressed="true"] svg{stroke:#0F1420}
.chk:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.sess .head{padding-right:48px;display:flex;flex-direction:column;gap:4px}

/* workout viz */
.viz{display:flex;align-items:flex-end;gap:2px;height:46px}
.viz span{display:block;border-radius:3px;min-width:2px}
.viz.sm{height:30px}
.flat{height:10px;border-radius:5px}

/* plan */
.weeks{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none;scroll-snap-type:x proximity}
.weeks::-webkit-scrollbar{display:none}
.wchip{flex:0 0 auto;width:54px;border-radius:14px;background:var(--card);border:2px solid transparent;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;scroll-snap-align:center}
.wchip b{font-family:var(--display);font-size:22px;line-height:1}
.wchip small{font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.wchip .ph{width:22px;height:4px;border-radius:2px;background:var(--zMP)}
.wchip[data-k="deload"] .ph{background:var(--zR)}
.wchip[data-k="taper"] .ph,.wchip[data-k="race"] .ph{background:var(--primary)}
.wchip[aria-current="true"]{border-color:var(--ink);background:var(--card2)}
.wchip.cur small{color:var(--primary)}
.wchip.full b{color:var(--ok)}
.wchip:focus-visible{outline:2px solid var(--primary)}
.pill{display:inline-block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;padding:4px 9px;border-radius:999px;background:var(--card2)}
.pill.build{color:var(--zMP)}.pill.deload{color:var(--muted)}.pill.taper,.pill.race{color:var(--primary)}
.dayhead{display:flex;align-items:baseline;gap:8px;margin:6px 2px -4px}
.dayhead b{font-family:var(--display);font-size:20px;text-transform:uppercase}
.rest{background:none;border:1px dashed var(--line);border-radius:14px;padding:10px 14px;color:var(--muted);font-size:14px}
.seg{display:inline-flex;background:var(--card2);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;font-weight:700;font-size:13px;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg button:focus-visible{outline:2px solid var(--primary)}

/* stats */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-family:var(--display);font-size:36px;font-weight:800;line-height:1}
.stat b small{font-size:16px;color:var(--muted);font-weight:600;margin-left:3px}
.stat span{font-size:13px;color:var(--muted)}
.ringwrap{display:flex;align-items:center;gap:16px}
.ring{width:96px;height:96px;flex:0 0 auto}
.chart{display:flex;align-items:flex-end;gap:4px;height:120px}
.chart .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.chart .bar{width:100%;border-radius:4px 4px 2px 2px;background:#33416A;position:relative;overflow:hidden}
.chart .bar i{position:absolute;left:0;right:0;bottom:0;background:var(--ok);border-radius:4px 4px 2px 2px}
.chart .c.dl .bar{background:#262F48}
.chart .c.now .bar{outline:2px solid var(--primary);outline-offset:1px}
.chart .c span{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.ms{display:flex;flex-direction:column;gap:2px}
.ms li{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.ms li:first-child{border-top:0}
.ms .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:18px;background:var(--card2)}
.ms .cd{font-family:var(--display);font-size:22px;font-weight:700;text-align:right;line-height:1}
.ms .cd small{display:block;font-family:var(--body);font-size:11px;color:var(--muted);font-weight:600}
ul{list-style:none;margin:0;padding:0}
.zones li{display:grid;grid-template-columns:10px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.zones li:first-child{border-top:0}
.zones i{width:10px;height:28px;border-radius:3px}
.zones b{font-variant-numeric:tabular-nums;font-weight:800}
select{font:700 15px var(--body);padding:8px 10px;border-radius:10px;border:0;background:var(--card2);color:var(--ink)}

/* gym */
.exl li{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 0;border-top:1px solid var(--line)}
.exl li:first-child{border-top:0}
.exl .n{font-weight:700}
.exl .rx{font-family:var(--display);font-size:20px;font-weight:700;color:var(--gym);text-align:right;white-space:nowrap}
.exl .h{grid-column:1/-1;color:var(--muted);font-size:14px}
.ghead{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.09em;color:var(--gym);margin-bottom:2px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(5,8,14,.6);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:480px;margin:0 auto;background:var(--card);border-radius:24px 24px 0 0;padding:10px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));max-height:88vh;overflow:auto;display:flex;flex-direction:column;gap:14px}
.x{position:absolute;right:14px;top:12px;width:36px;height:36px;border-radius:50%;border:0;background:var(--card2);color:var(--ink);font-size:22px;line-height:1;cursor:pointer}
.x:focus-visible{outline:2px solid var(--primary)}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 4px}
.steps li{display:grid;grid-template-columns:6px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.steps li:first-child{border-top:0}
.steps i{width:6px;height:34px;border-radius:3px}
.steps b{font-variant-numeric:tabular-nums}
.btn{border:0;border-radius:14px;padding:14px;font-weight:800;font-size:16px;background:var(--primary);color:#1A0C06;cursor:pointer;width:100%}
.btn.ghost{background:var(--card2);color:var(--ink)}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(15,20,32,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px max(8px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabbar nav{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--muted);padding:4px 0;cursor:pointer}
.tabbar svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabbar button[aria-selected="true"]{color:var(--primary)}
.tabbar button:focus-visible{outline:2px solid var(--primary);border-radius:8px}
.status{font-size:12px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}}
</style>
</head>
<body>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Sessie" hidden></div>

  <button role="tab" data-tab="plan" aria-selected="false"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Plan</button>
  <button role="tab" data-tab="gym" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg>Fitness</button>
  <button role="tab" data-tab="stats" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Stats</button>

<script>

function one(t){ var m=/^(MP|TT|[ERTI])([\d.]+)(m?)$/.exec(t); var s={z:m[1]}; if(m[3]) s.min=+m[2]; else s.km=+m[2]; return s; }

 {k:"build", q:"E2 3x[T3 R2.5m] E2", e:10, l:"E25 MP5", lt:"licht", b:60},
 {k:"build", q:"E2 6x[I1 R1.5m] E3", e:10, l:"E10 MP8 E1 MP8 E3", lt:"zwaarder", b:60, ln:"Generale repetitie: ontbijt, schoenen, gels."},
 {k:"build", q:"E3 T30m E3", e:10, l:"E23 MP7 E2", lt:"licht", b:60, ln:"Je langste duurloop."},
 {k:"taper", q:"E2 3x[MP3 R1m] 4x[I0.2 R1m] E2", e:8, l:"E8 MP12 E4", lt:"zwaarder", b:45},

 {k:"race",  q:"E2 3x[MP1 R2m] 4x[I0.1 R1m] E1", e:5, l:"MP42.195", lt:"race", b:0}
];

var PH={1:"Basis",2:"Kracht",3:"Kracht & power",4:"Piek & taper"};
var KL={build:"Opbouw",deload:"Deload",taper:"Taper",race:"Raceweek"};

var GYM = {
 A:{name:"Workout A · Kracht", when:"Na de interval, liefst 3 u+ ertussen of direct erna. ±75 min.",
  groups:[
   ["Opwarming",[
     ["Fietsen of roeien + mobiliteit","Heup- en enkelmobiliteit, glute bridge 2×10, monster walk 2×10",["10'","10'","10'","10'"]]]],

    '<div class="stat"><b class="num">'+m.done+'<small>/'+m.total+'</small></b><span>sessies in totaal</span></div></div>';
  out+='<div class="card"><div class="between"><div class="eyebrow">Loopvolume per week</div><span class="small muted"><span style="color:var(--ok)">■</span> gelopen</span></div><div class="chart" style="margin-top:12px">'+
    m.planned.map(function(p,i){ var hp=p/maxP*100, hd=p?Math.min(1,m.donew[i]/p)*100:0; return '<div class="c'+(W[i].k!=="build"?" dl":"")+(i===curW&&dayIdx>=0?" now":"")+'" title="Week '+(i+1)+': '+kmTxt(m.donew[i])+' van '+kmTxt(p)+' km"><div class="bar" style="height:'+hp.toFixed(1)+'%"><i style="height:'+hd.toFixed(1)+'%"></i></div><span>'+(i+1)+'</span></div>'; }).join("")+
    '</div><div class="small muted" style="margin-top:8px">Piek in training: '+kmTxt(pk)+' km in week '+pkW+'. Donkere balken zijn deload- en taperweken.</div></div>';
  var ms=[["5K","var(--zI)","5 km PR-poging","onder 22:46",dateOf(11,5)],["32","var(--zMP)","Langste duurloop","32 km",dateOf(14,6)],["42","var(--primary)","Sofico Gent Marathon","doel "+fmtH(goalSec),RACE]];
  out+='<div class="card"><div class="eyebrow" style="margin-bottom:4px">Mijlpalen</div><ul class="ms">'+ms.map(function(x){ var n=daysUntil(x[4]); return '<li><span class="ic" style="color:'+x[1]+'">'+x[0]+'</span><div><div style="font-weight:800">'+x[2]+'</div><div class="small muted">'+dstr(x[4])+' · '+x[3]+'</div></div><div class="cd num">'+(n>=0?n:"✓")+'<small>'+(n>=0?"dagen":"gedaan")+'</small></div></li>'; }).join("")+'</ul></div>';
  out+='<div class="card"><div class="between"><div><div class="eyebrow">Doeltijd</div><div class="disp" style="font-size:30px;line-height:1.1">'+fmt(pace("MP"))+'<span class="muted" style="font-size:16px">/km marathontempo</span></div></div><select id="goalSel" aria-label="Doeltijd">';
  for(var mm=210;mm<=270;mm++) out+='<option value="'+mm*60+'"'+(mm*60===goalSec?" selected":"")+'>'+fmtH(mm*60)+'</option>';
  out+='</select></div><div class="eyebrow" style="margin:14px 0 2px">Jouw zones</div><ul class="zones">'+MYZONES.map(function(z){ return '<li><i style="background:'+ZC[z[2]]+'"></i><span>'+z[0]+'</span><b>'+z[1]+'</b></li>'; }).join("")+'</ul></div>';
  out+='<div class="status" id="status">'+statusTxt+'</div>';
  return out;
}

// ---------- sheet ----------
function openSheet(w,id){
  var f=findSess(w,id); if(!f) return; sheetRef={w:w,id:id};
  var s=effSess(w,f.s), done=!!weekState(w).done[id], c=color(s), h='<div class="grab"></div><button class="x" type="button" data-close="1" aria-label="Sluiten">×</button>';
  h+='<div style="padding-right:48px;display:flex;flex-direction:column;gap:4px"><span class="eyebrow" style="color:'+c+'">'+s.tag+'</span><h2 style="font-size:26px">'+s.title+'</h2><span class="small muted">'+DAYS[f.d]+' '+dstr(dateOf(w,f.d))+' · week '+(w+1)+'</span></div>'+facts(s);
  if(s.p){
    h+=viz(s.p.segs);
    h+='<ul class="steps">'+s.p.steps.map(function(st){
      var it=st.items, main=it[0];
      var txt=(st.n>1?st.n+" × ":"")+it.map(function(x){ return dist(x)+" "+ZN[x.z].toLowerCase(); }).join(" + ");
      return '<li><i style="background:'+ZC[main.z]+'"></i><span>'+txt+'</span><b>'+paceTxt(main.z)+'</b></li>';
    }).join("")+'</ul>';
  }
  if(s.note) h+='<div class="card" style="background:var(--card2)"><span class="small">'+s.note+'</span></div>';
  if(s.gym) h+='<button class="btn ghost" data-gotogym="'+s.gym+'">Bekijk oefeningen</button>';
  h+='<button class="btn" data-chk="'+w+'|'+id+'">'+(done?"Markeer als niet gedaan":"Markeer als gedaan")+'</button>';
  var sh=document.getElementById("sheet"); sh.innerHTML=h; sh.hidden=false; document.getElementById("scrim").hidden=false;
  var b=sh.querySelector(".btn:last-child"); if(b) b.focus();
}
function closeSheet(){ sheetRef=null; document.getElementById("sheet").hidden=true; document.getElementById("scrim").hidden=true; }

// ---------- render + events ----------
function render(){
  var app=document.getElementById("app");
  app.innerHTML = tab==="today"?screenToday():tab==="plan"?screenPlan():tab==="gym"?screenGym():screenStats();
  Array.prototype.forEach.call(document.querySelectorAll("#tabs button"),function(b){ b.setAttribute("aria-selected",String(b.dataset.tab===tab)); });
  if(tab==="plan"){ var c=document.querySelector('.wchip[aria-current="true"]'); if(c) c.scrollIntoView({inline:"center",block:"nearest"}); }
  var gs=document.getElementById("goalSel"); if(gs) gs.onchange=function(){ saveGoal(+gs.value); };
  if(sheetRef) openSheet(sheetRef.w,sheetRef.id);
  try{ localStorage.setItem("gent_tab",tab); }catch(e){}
}
document.addEventListener("click",function(e){
  var t=e.target.closest("[data-chk],[data-open],[data-tab],[data-week],[data-easy],[data-gym],[data-gotogym],[data-day],[data-close],#scrim");
  if(!t) return;
  if(t.id==="scrim"||t.dataset.close){ closeSheet(); return; }
  if(t.dataset.chk){ e.stopPropagation(); var p=t.dataset.chk.split("|"); toggle(+p[0],p[1]); return; }
  if(t.dataset.open){ var q=t.dataset.open.split("|"); openSheet(+q[0],q[1]); return; }
  if(t.dataset.tab){ tab=t.dataset.tab; closeSheet(); render(); window.scrollTo(0,0); return; }
  if(t.dataset.week){ curSelW=+t.dataset.week; render(); return; }
  if(t.dataset.easy){ var r=t.dataset.easy.split("|"); setEasy(+r[0],r[1]); return; }
  if(t.dataset.gym){ gymSel=t.dataset.gym; render(); return; }
  if(t.dataset.gotogym){ gymSel=t.dataset.gotogym; tab="gym"; closeSheet(); render(); window.scrollTo(0,0); return; }
  if(t.dataset.day){ var dd=t.dataset.day.split("|"); curSelW=+dd[0]; tab="plan"; render(); window.scrollTo(0,0); }
});
document.addEventListener("keydown",function(e){
  if(e.key==="Escape") closeSheet();
  if((e.key==="Enter"||e.key===" ") && e.target.dataset && e.target.dataset.open){ e.preventDefault(); var q=e.target.dataset.open.split("|"); openSheet(+q[0],q[1]); }
});

var local=lsGet(); if(local){ state.weeks=local.weeks||{}; if(local.goal) goalSec=local.goal; }
statusTxt="Opgeslagen op dit toestel";
render();
if("serviceWorker" in navigator){ window.addEventListener("load",function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); }); }
})();
</script>
