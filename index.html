<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Op weg naar Gent</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gent 42">
<style>html,body{margin:0}:root{padding-top:env(safe-area-inset-top,0px)}img{max-width:100%}</style>
<meta name="theme-color" content="#0F1420">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Mobile-first app shell (max 480px): screens Vandaag / Plan / Fitness / Stats with a fixed bottom tab bar.
   Single deliberate dark theme, zone colours carry meaning (rustig, marathontempo, threshold, interval). */
:root{
  --bg:#0F1420; --card:#182033; --card2:#202A42; --ink:#F3F5FA; --muted:#8F9AB2; --line:#2A3552;
  --primary:#FF6B4A; --ok:#3FC98A;
  --zR:#5E6985; --zE:#3FC98A; --zMP:#5B8CFF; --zT:#FFA63D; --zI:#FF4F7B; --bike:#2EC4C4; --gym:#A47CFF;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit}
.app{max-width:480px;margin:0 auto;padding-block:16px calc(96px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.num{font-variant-numeric:tabular-nums}
.disp{font-family:var(--display);font-weight:700;letter-spacing:.01em}
.eyebrow{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
h1,h2,h3{margin:0;text-wrap:balance}
.card{background:var(--card);border-radius:18px;padding:16px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.muted{color:var(--muted)}
.small{font-size:13px}

/* top */
.top h1{font-family:var(--display);font-size:34px;font-weight:800;line-height:1;text-transform:uppercase}
.hero{position:relative;overflow:hidden;background:linear-gradient(150deg,#22305A 0%,#182033 55%,#1A1F33 100%);border-radius:22px;padding:18px}
.hero .big{font-family:var(--display);font-size:76px;font-weight:800;line-height:.85;color:var(--ink)}
.hero .big small{font-size:22px;font-weight:600;color:var(--muted);margin-left:6px}
.hero .route{position:absolute;right:-10px;top:-6px;width:170px;opacity:.35}
.hero .meta{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.hero .meta div{background:rgba(255,255,255,.06);border-radius:12px;padding:8px 10px}
.hero .meta b{display:block;font-family:var(--display);font-size:22px;line-height:1.1}
.hero .meta span{font-size:10px;white-space:nowrap;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}

/* week dots */
.dots{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dot{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--muted);background:none;border:0;padding:0;cursor:pointer}
.dot i{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);font-style:normal;font-weight:700;font-size:13px;color:var(--muted)}
.dot.has i{border-color:var(--muted)}
.dot.part i{border-color:var(--primary);color:var(--ink)}
.dot.done i{background:var(--ok);border-color:var(--ok);color:#0F1420}
.dot.today span{color:var(--ink);font-weight:800}
.dot.today i{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--primary)}
.dot:focus-visible i{outline:2px solid var(--primary);outline-offset:3px}

/* session card */
.sess{background:var(--card);border-radius:18px;padding:14px 14px 14px 16px;display:flex;flex-direction:column;gap:10px;position:relative;cursor:pointer;border:1px solid transparent;text-align:left;width:100%}
.sess:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.sess .kind{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}
.sess .kind::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.sess h3{font-size:19px;font-weight:800;line-height:1.2}
.facts{display:flex;gap:14px;font-size:14px;color:var(--muted)}
.facts b{color:var(--ink);font-weight:700}
.sess.isdone{opacity:.6}
.sess.isdone h3{text-decoration:line-through;text-decoration-thickness:2px}
.chk{position:absolute;right:12px;top:12px;width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:var(--card2);display:grid;place-items:center;cursor:pointer}
.chk svg{width:20px;height:20px;stroke:var(--muted)}
.chk[aria-pressed="true"]{background:var(--ok);border-color:var(--ok)}
.chk[aria-pressed="true"] svg{stroke:#0F1420}
.chk:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.sess .head{padding-right:48px;display:flex;flex-direction:column;gap:4px}

/* workout viz */
.viz{display:flex;align-items:flex-end;gap:2px;height:46px}
.viz span{display:block;border-radius:3px;min-width:2px}
.viz.sm{height:30px}
.flat{height:10px;border-radius:5px}

/* plan */
.weeks{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none;scroll-snap-type:x proximity}
.weeks::-webkit-scrollbar{display:none}
.wchip{flex:0 0 auto;width:54px;border-radius:14px;background:var(--card);border:2px solid transparent;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;scroll-snap-align:center}
.wchip b{font-family:var(--display);font-size:22px;line-height:1}
.wchip small{font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.wchip .ph{width:22px;height:4px;border-radius:2px;background:var(--zMP)}
.wchip[data-k="deload"] .ph{background:var(--zR)}
.wchip[data-k="taper"] .ph,.wchip[data-k="race"] .ph{background:var(--primary)}
.wchip[aria-current="true"]{border-color:var(--ink);background:var(--card2)}
.wchip.cur small{color:var(--primary)}
.wchip.full b{color:var(--ok)}
.wchip:focus-visible{outline:2px solid var(--primary)}
.pill{display:inline-block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;padding:4px 9px;border-radius:999px;background:var(--card2)}
.pill.build{color:var(--zMP)}.pill.deload{color:var(--muted)}.pill.taper,.pill.race{color:var(--primary)}
.dayhead{display:flex;align-items:baseline;gap:8px;margin:6px 2px -4px}
.dayhead b{font-family:var(--display);font-size:20px;text-transform:uppercase}
.rest{background:none;border:1px dashed var(--line);border-radius:14px;padding:10px 14px;color:var(--muted);font-size:14px}
.seg{display:inline-flex;background:var(--card2);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;font-weight:700;font-size:13px;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg button:focus-visible{outline:2px solid var(--primary)}

/* stats */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-family:var(--display);font-size:36px;font-weight:800;line-height:1}
.stat b small{font-size:16px;color:var(--muted);font-weight:600;margin-left:3px}
.stat span{font-size:13px;color:var(--muted)}
.ringwrap{display:flex;align-items:center;gap:16px}
.ring{width:96px;height:96px;flex:0 0 auto}
.chart{display:flex;align-items:flex-end;gap:4px;height:120px}
.chart .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.chart .bar{width:100%;border-radius:4px 4px 2px 2px;background:#33416A;position:relative;overflow:hidden}
.chart .bar i{position:absolute;left:0;right:0;bottom:0;background:var(--ok);border-radius:4px 4px 2px 2px}
.chart .c.dl .bar{background:#262F48}
.chart .c.now .bar{outline:2px solid var(--primary);outline-offset:1px}
.chart .c span{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.ms{display:flex;flex-direction:column;gap:2px}
.ms li{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.ms li:first-child{border-top:0}
.ms .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:18px;background:var(--card2)}
.ms .cd{font-family:var(--display);font-size:22px;font-weight:700;text-align:right;line-height:1}
.ms .cd small{display:block;font-family:var(--body);font-size:11px;color:var(--muted);font-weight:600}
ul{list-style:none;margin:0;padding:0}
.zones li{display:grid;grid-template-columns:10px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.zones li:first-child{border-top:0}
.zones i{width:10px;height:28px;border-radius:3px}
.zones b{font-variant-numeric:tabular-nums;font-weight:800}
select{font:700 15px var(--body);padding:8px 10px;border-radius:10px;border:0;background:var(--card2);color:var(--ink)}

/* gym */
.exl li{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 0;border-top:1px solid var(--line)}
.exl li:first-child{border-top:0}
.exl .n{font-weight:700}
.exl .rx{font-family:var(--display);font-size:20px;font-weight:700;color:var(--gym);text-align:right;white-space:nowrap}
.exl .h{grid-column:1/-1;color:var(--muted);font-size:14px}
.ghead{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.09em;color:var(--gym);margin-bottom:2px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(5,8,14,.6);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:480px;margin:0 auto;background:var(--card);border-radius:24px 24px 0 0;padding:10px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));max-height:88vh;overflow:auto;display:flex;flex-direction:column;gap:14px}
.x{position:absolute;right:14px;top:12px;width:36px;height:36px;border-radius:50%;border:0;background:var(--card2);color:var(--ink);font-size:22px;line-height:1;cursor:pointer}
.x:focus-visible{outline:2px solid var(--primary)}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 4px}
.steps li{display:grid;grid-template-columns:6px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.steps li:first-child{border-top:0}
.steps i{width:6px;height:34px;border-radius:3px}
.steps b{font-variant-numeric:tabular-nums}
.btn{border:0;border-radius:14px;padding:14px;font-weight:800;font-size:16px;background:var(--primary);color:#1A0C06;cursor:pointer;width:100%}
.btn.ghost{background:var(--card2);color:var(--ink)}
.feel{display:flex;flex-direction:column;gap:8px}
.fuel{display:flex;flex-direction:column;gap:8px}
.guide{display:flex;flex-direction:column;gap:8px;scroll-margin-top:16px}
.guide h2{font-size:21px}
.guide p{margin:0;font-size:15px;color:var(--muted)}
.guide p b{color:var(--ink)}
.guide .demo{background:var(--bg);border-radius:14px;padding:12px;margin-top:4px;pointer-events:none}
.guide .demo .sess{background:var(--card)}
.guide .lnk{align-self:flex-start;margin-top:2px}
.toc{display:flex;flex-wrap:wrap;gap:6px}
.toc a{background:var(--card);color:var(--ink);text-decoration:none;font-size:13px;font-weight:700;padding:7px 12px;border-radius:999px}
.toc a:focus-visible{outline:2px solid var(--primary)}
.fp,.dp,.sg{display:inline-block}
.fp{border:1px solid var(--line);background:var(--card2);border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px}
.fp.on{background:var(--primary);border-color:var(--primary);color:#1A0C06}
.dp{border:1px solid var(--line);background:var(--card2);border-radius:12px;padding:6px 0;font-weight:800;display:flex;flex-direction:column;align-items:center;font-size:14px}
.dp small{font-size:11px;color:var(--muted);font-weight:600}
.dp.on{background:var(--ink);color:var(--bg)}.dp.on small{color:var(--bg)}
.sg{padding:6px 12px;border-radius:8px;font-weight:700;font-size:13px;color:var(--muted)}
.sg.on{background:var(--ink);color:var(--bg)}
.fakein{display:block;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center;font-weight:600;color:var(--ink)}
.fuel .lbl{font-size:14px;color:var(--muted);font-weight:600}
.wxrow{display:flex;gap:14px;align-items:center;margin-top:8px}
.mobbtns{display:flex;flex-direction:column;gap:8px}
.mobbtns .btn{display:flex;justify-content:space-between;align-items:center;text-align:left;padding:12px 14px;font-size:15px}
.mobbtns small{color:var(--muted);font-weight:700}
.mob{position:fixed;inset:0;z-index:70;background:var(--bg);overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
.mobin{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.mobprog{height:6px;border-radius:3px;background:var(--card2);overflow:hidden}
.mobprog i{display:block;height:100%;background:var(--ok);transition:width 1s linear}
.mobclock{font-family:var(--display);font-weight:800;font-size:120px;line-height:1;text-align:center;margin:20px 0;color:var(--ok)}
@media (prefers-reduced-motion:reduce){.mobprog i{transition:none}}
.daypick{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.daypick button{border:1px solid var(--line);background:var(--card2);border-radius:12px;padding:6px 0;font-weight:800;cursor:pointer;display:flex;flex-direction:column;align-items:center;font-size:14px}
.daypick small{font-size:11px;color:var(--muted);font-weight:600}
.daypick button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.daypick button[aria-pressed="true"] small{color:var(--bg)}
.form{display:grid;grid-template-columns:auto 1fr auto;gap:8px 10px;align-items:center}
.form label,.form .lbl{font-size:14px;color:var(--muted);font-weight:600}
.form .feelrow,.form .row{grid-column:2/4}
.form .feelrow button{padding:6px 12px}
input[type=number],input[type=text],textarea{font:600 16px var(--body);background:var(--card2);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%;min-width:0}
textarea{font-weight:500;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--primary);outline-offset:1px}
.unit{font-size:13px;color:var(--muted)}
.logbox{display:flex;flex-direction:column;gap:10px;background:var(--card2);border-radius:16px;padding:14px}
.logbox input,.logbox select,.logbox textarea{background:var(--card)}
.lnk{border:0;background:none;color:var(--primary);font-weight:800;cursor:pointer;padding:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{background:var(--card2);border-radius:999px;padding:6px 12px;font-size:14px;color:var(--muted)}
.chip b{color:var(--ink)}
.chip.bad b,.chip.bad{color:var(--zT)}
.daily{display:flex;flex-direction:column;gap:12px}
.daily .row select{flex:1}
.alert{border-radius:14px;padding:12px 14px;font-size:14px;border-left:4px solid var(--zT);background:rgba(255,166,61,.1)}
.alert.stop{border-color:var(--zI);background:rgba(255,79,123,.12)}
.alert.info{border-color:var(--zMP);background:rgba(91,140,255,.1)}
.summary .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 8px}
.summary .grid3 b{display:block;font-family:var(--display);font-size:28px;font-weight:800;line-height:1}
.summary .grid3 span{font-size:12px;color:var(--muted)}
.summary .next{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 6px}
.bitem{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:11px;font-weight:700;color:var(--muted);opacity:.45}
.bitem.got{opacity:1;color:var(--ink)}
.bdg{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:18px;background:var(--card2);border:2px dashed var(--line);color:var(--muted)}
.bdg.on{background:radial-gradient(circle at 30% 30%,#FF8E6E,#FF6B4A 55%,#C9452B);border:0;color:#1A0C06;box-shadow:0 4px 14px rgba(255,107,74,.35)}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:60;width:min(440px,calc(100% - 32px));background:var(--card2);border:1px solid var(--primary);border-radius:18px;padding:12px 14px;display:flex;gap:12px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.toast.pop{animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:translate(-50%,-20px) scale(.85);opacity:0}to{transform:translate(-50%,0) scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.toast.pop{animation:none}}
.kgrow{grid-column:1/-1;display:flex;align-items:center;gap:8px;margin-top:6px}
.kgrow input{width:84px;flex:0 0 auto;padding:7px 8px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}
.legend b{color:var(--ink)}
.loglist li{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.loglist li:first-child{border-top:0}
.delta{font-family:var(--display);font-weight:800;font-size:20px;text-align:right;white-space:nowrap;line-height:1}
.delta small{display:block;font-family:var(--body);font-size:10px;color:var(--muted);font-weight:600}
.blocks{display:flex;flex-direction:column;gap:8px}
.blocks .lbl{font-size:14px;color:var(--muted);font-weight:600}
.bgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bcell{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--muted);font-weight:700}
.bcell input{padding:8px;text-align:center}
.bdots{display:flex;gap:4px;margin-top:6px}
.bdots i{width:10px;height:10px;border-radius:50%;background:var(--ok)}
.bdots i.fast{background:var(--zT)}.bdots i.slow{background:var(--zMP)}.bdots i.none{background:var(--line)}
.delta.ok{color:var(--ok)}.delta.fast{color:var(--zT)}.delta.slow{color:var(--zMP)}
details summary{cursor:pointer}
details textarea{margin-top:8px}
.feelrow{display:flex;flex-wrap:wrap;gap:6px}
.feelrow button{border:1px solid var(--line);background:var(--card2);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;cursor:pointer}
.feelrow button[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:#1A0C06}
.feelrow button:focus-visible,.modban button:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.prop{border:1.5px solid var(--primary);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.prop.info{border-color:var(--line)}
.modban{display:flex;align-items:center;justify-content:space-between;gap:10px;background:rgba(255,107,74,.12);border-radius:12px;padding:10px 12px;font-size:14px}
.modban button{border:0;background:none;color:var(--primary);font-weight:800;cursor:pointer;white-space:nowrap}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* tab bar */

<script>

// ---------- zones ----------
var ZN={R:"Dribbel",E:"Rustig",MP:"Marathontempo",T:"Threshold",I:"Interval",TT:"Voluit"};

function pace(z){ return {R:420,E:380,MP:goalSec/42.195,T:297,I:271,TT:272}[z]; }
function fmt(s){ s=Math.round(s); var m=Math.floor(s/60),r=s%60; return m+":"+(r<10?"0":"")+r; }
function fmtH(s){ var h=Math.floor(s/3600),m=Math.floor(s%3600/60),r=s%60; return h+":"+(m<10?"0":"")+m+":"+(r<10?"0":"")+r; }
function paceTxt(z){ return {R:"",E:"6:00–6:40/km",MP:fmt(pace("MP"))+"/km",T:"4:50–5:05/km",I:"4:25–4:37/km",TT:"< 4:33/km"}[z]; }
var MYZONES=[["Recovery","> 6:43","R"],["Aerobic endurance","5:29–6:43","E"],["Aerobic power","5:08–5:28","MP"],["Threshold","4:38–5:07","T"],["Anaerobic endurance","4:14–4:37","I"],["Anaerobic power","< 4:14","I"]];

// ---------- workout DSL: "E2 6x[I0.8 R2m] E2" (km, or minutes with m) ----------
function one(t){ var m=/^(MP|TT|[ERTI])([\d.]+)(m?)$/.exec(t); var s={z:m[1]}; if(m[3]) s.min=+m[2]; else s.km=+m[2]; return s; }
function parse(str){
  var toks=str.match(/\d+x\[[^\]]+\]|\S+/g), segs=[], steps=[];
  toks.forEach(function(t){
    var r=/^(\d+)x\[(.+)\]$/.exec(t);
    if(r){ var n=+r[1], items=r[2].split(" ").map(one); steps.push({n:n,items:items});
      for(var i=0;i<n;i++) items.forEach(function(s,j){ if(i===n-1 && j===items.length-1 && s.z==="R") return; segs.push(s); });
    } else { var s=one(t); steps.push({n:1,items:[s]}); segs.push(s); }
  });
  return {segs:segs,steps:steps};
}
function segMin(s){ return s.min!=null? s.min : s.km*pace(s.z)/60; }
function segKm(s){ return s.km!=null? s.km : s.min*60/pace(s.z); }
function sumKm(segs){ return segs.reduce(function(a,s){return a+segKm(s);},0); }
function sumMin(segs){ return segs.reduce(function(a,s){return a+segMin(s);},0); }
function dist(s){ if(s.min!=null){ var w=Math.floor(s.min), sec=Math.round((s.min-w)*60); return w+"'"+(sec?(sec<10?"0":"")+sec:""); } return s.km<1? Math.round(s.km*1000)+" m" : kmTxt(s.km)+" km"; }

var GYM = {

  groups:[

function qKind(segs){ var z=segs.map(function(s){return s.z;}); return z.indexOf("T")>=0?"T":z.indexOf("MP")>=0&&z.indexOf("I")<0?"MP":z.indexOf("MP")>=0?"MP":"I"; }
function sessionsFor(w){
  var d=W[w], race=d.k==="race", days=[[],[],[],[],[],[],[]], q=parse(d.q);
  if(d.tt) days[1].push({id:"di_run",type:"E",tag:"Easy + strides",title:"Rustig met strides",p:q,note:"Geen interval deze week: frisse benen voor zaterdag."});
  else { var k=qKind(q.segs); days[1].push({id:"di_run",type:k,tag:{T:"Tempo",I:"Interval",MP:"Marathontempo"}[k],title:race?"Laatste prikkel":titleOf(q),p:q,note:race?"Kort en scherp. Niets forceren.":""}); }
  if(w<=16) days[1].push({id:"di_gym",type:"gym",tag:"Fitness",title:w===16?"Workout A · licht":"Workout A · Kracht",gym:"A",note:w===16?"Laatste gymsessie: 2 sets per oefening, licht.":(d.k!=="build"?"Deloadversie: 1 set minder, RPE 6.":"Na de loopsessie.")});
  days[3].push({id:"do_easy",type:"E",tag:race?"Shake-out":"Easy",title:race?"Shake-out":"Easy run",p:parse("E"+d.e),easy:!race,note:race?"Heel rustig, met 4 strides op het einde.":""});
  if(w<=15) days[3].push({id:"do_gym",type:"gym",tag:"Fitness",title:"Workout B · Plyo",gym:"B",note:d.tt?"Lichte versie: geen plyo, 2 sets per oefening. Zaterdag is de time trial.":(d.k!=="build"?"Deloadversie: 1 set minder, plyo halveren.":"Plyo eerst, dan kracht.")});
  if(d.tt) days[5].push({id:"za_tt",type:"TT",tag:"Time trial",title:"5 km PR-poging",p:parse(d.tt),note:"Doel: onder 22:46. Eerste km op 4:35, niet sneller; vanaf km 3 versnellen, laatste km alles. Vlak parcours of de piste."});
  else if(race) days[5].push({id:"za_bike",type:"bike",tag:"Fiets",title:"Optioneel losfietsen",bmin:25,note:"20–30 min heel rustig, of gewoon rust. Rugnummer ophalen en koolhydraten stapelen."});
  else days[5].push({id:"za_bike",type:"bike",tag:"Fietstocht",title:d.b+" km fietsen",bkm:d.b,note:"Duurtempo, rustig genoeg om zondag fris te zijn."});
  var lp=parse(d.l);
  days[6].push(race?{id:"zo_long",type:"race",tag:"Race",title:"Sofico Gent Marathon",p:lp,note:"Eerste 5 km bewust 5–10 s/km trager dan marathontempo. Gels om de ±40 minuten."}:
    {id:"zo_long",type:"long",tag:"Long run · "+d.lt,title:Math.round(sumKm(lp.segs))+" km long run",p:lp,note:d.ln||""});
  var mv=(state.weeks[key(w)]||{}).move;
  if(mv && Object.keys(mv).length){ var all=[]; days.forEach(function(dd,di){ dd.forEach(function(s){ all.push([s,di]); }); }); days=[[],[],[],[],[],[],[]];
    all.forEach(function(x){ var to=mv[x[0].id]; if(to!=null&&to!==x[1]){ x[0].from=x[1]; days[to].push(x[0]); } else days[x[1]].push(x[0]); }); }
  return days;
}
function titleOf(q){ var r=q.steps.filter(function(s){return s.n>1;})[0]; if(!r){ var c=q.steps.filter(function(s){return s.items[0].z!=="E";})[0]; return c?dist(c.items[0])+" "+ZN[c.items[0].z].toLowerCase():"Kwaliteit"; } return r.n+" × "+dist(r.items[0]); }

function runKmOf(w,s,ws){ var e=effSess(w,s); return e.p? sumKm(e.p.segs) : 0; }

function saveGoal(g){ goalSec=g; lsSet(); render(); if(store==="db"){ chain.s=(chain.s||Promise.resolve()).then(function(){ return db.doc("settings/main").set({goal:g}); }).catch(function(){}); } }

  if(md){ var b={id:s.id,orig:s,feel:md.feel,type:md.type,tag:md.tag,title:md.title,note:md.note}; if(md.dsl) b.p=parse(md.dsl); if(md.bmin) b.bmin=md.bmin; if(md.bkm) b.bkm=md.bkm; return b; }

function findSess(w,id){ var r=null; sessionsFor(w).forEach(function(d,di){ d.forEach(function(s){ if(s.id===id) r={s:s,d:di}; }); }); return r; }

// ---------- metrics ----------
function metrics(){
  var m={doneRun:0,doneBike:0,done:0,total:0,dueTotal:0,dueDone:0,longest:0,gym:0,gymTotal:0,mods:0,pr:null,raceDone:false,rpe:[],planned:[],donew:[],streak:0,maxStreak:0};
  for(var w=0;w<18;w++){
    var ws=weekState(w), pw=0, dw=0, all=true;
    sessionsFor(w).forEach(function(day,di){ day.forEach(function(s){
      var km=runKmOf(w,s,ws); pw+=km; m.total++; if(s.gym) m.gymTotal++; if(ws.mod[s.id]) m.mods++;
      var lg=ws.log[s.id]; if(lg&&lg.rpe) m.rpe.push(+lg.rpe); if(s.id==="za_tt"&&ws.done[s.id]&&lg&&lg.sec) m.pr=lg.sec; if(s.type==="race"&&ws.done[s.id]) m.raceDone=true;
      var due = w*7+di<=dayIdx;
      if(due) m.dueTotal++;
      if(ws.done[s.id]){ m.done++; if(due) m.dueDone++; dw+=km; m.doneRun+=km; if(s.bkm) m.doneBike+=s.bkm; if(s.easy&&ws.easy==="bike") m.doneBike+=20; if(s.gym) m.gym++; if(s.p&&km>m.longest) m.longest=km; }
      else all=false;
    }); });
    m.planned.push(pw); m.donew.push(dw); m.weekFull=m.weekFull||[]; m.weekFull.push(all);
  }
  for(var i=curW-1;i>=0;i--){ if(m.weekFull[i]) m.streak++; else break; }

  var run=0; for(var j=0;j<18;j++){ if(m.weekFull[j]){ run++; if(run>m.maxStreak) m.maxStreak=run; } else run=0; }
  return m;
}

// ---------- helpers: time, hard days ----------
function parseTime(t){ t=(t||"").trim().replace(",","."); if(!t) return null; var p=t.split(":").map(Number); if(p.some(isNaN)) return null; if(p.length===1) return Math.round(p[0]*60); if(p.length===2) return p[0]*60+p[1]; return p[0]*3600+p[1]*60+p[2]; }
function tStr(s){ if(s==null) return ""; s=Math.round(s); var h=Math.floor(s/3600), m=Math.floor(s%3600/60), r=s%60; return (h?h+":"+(m<10?"0":""):"")+m+":"+(r<10?"0":"")+r; }
function isHard(w,s){ var e=effSess(w,s); return !!e.p && ["I","T","MP","TT","long","race"].indexOf(e.type)>=0; }
function moveWarn(w,id,to){
  var days=sessionsFor(w), me=null, from=-1; days.forEach(function(d,di){ d.forEach(function(s){ if(s.id===id){ me=s; from=di; } }); });
  if(!me) return ""; var hard=isHard(w,me), msgs=[];
  function hardOn(di){ if(di<0||di>6) return null; var r=null; days[di].forEach(function(s){ if(s.id!==id&&isHard(w,s)) r=s; }); return r; }
  if(hard){ var same=hardOn(to); if(same) msgs.push("Er staat die dag al een zware sessie ("+effSess(w,same).title+")."); var nb=hardOn(to-1)||hardOn(to+1); if(nb) msgs.push("Dan vallen er twee zware dagen na elkaar (naast "+effSess(w,nb).title+"). Hou minstens 1 rustige dag ertussen."); if(to===0&&w>0) msgs.push("Maandag komt direct na je long run van zondag."); if(to===6&&me.id!=="zo_long") msgs.push("Zondag is je long run-dag."); }

  return msgs.join(" ");
}

// ---------- prediction ----------
function predictions(){
  var pts=[{w:-0.5,src:"Halve marathon 1:47:57",sec:Math.round(6477*Math.pow(42.195/21.0975,1.06))}];
  var ADJ={1:-3,2:-3,3:-3,4:-3,5:0,6:3,7:7,8:12,9:18,10:25};
  for(var w=0;w<18;w++){ var ws=weekState(w); sessionsFor(w).forEach(function(day){ day.forEach(function(s0){ var lg=ws.log[s0.id]; if(!lg||!ws.done[s0.id]) return; var s=effSess(w,s0);
    if(s.type==="TT"&&lg.sec) pts.push({w:w,src:"5 km in "+tStr(lg.sec),sec:Math.round(lg.sec*Math.pow(42.195/5,1.07))});
    if(s0.id==="zo_long"&&s.type!=="race"&&lg.blocks){ var be=blockEval(s,lg.blocks); if(be.n){ var r=lg.rpe||6; pts.push({w:w,src:"MP-blokken "+fmt(be.avg)+"/km bij RPE "+r,sec:Math.round((be.avg+ADJ[r])*42.195)}); } }
    if(s.type==="race"&&lg.sec) pts.push({w:w,src:"Gent Marathon",sec:lg.sec,race:true});
  }); }); }
  return pts;
}

  var badges='<div class="badges">'+[["100","100 km",1],["20+","20 km",1],["4×","4 op rij",0],["PR","5K PR",0]].map(function(b){ return '<div class="bitem'+(b[2]?" got":"")+'"><span class="bdg'+(b[2]?" on":"")+'">'+b[0]+'</span><span>'+b[1]+'</span></div>'; }).join("")+'</div>';

// ---------- sheet ----------
var FEELS=[["top","Top"],["ok","Normaal"],["moe","Moe"],["kapot","Uitgeput"],["pijn","Pijntje"]];
var FEELW={top:"top",ok:"normaal",moe:"moe",kapot:"uitgeput",pijn:"niet pijnvrij"};
var sheetFeel=null, sheetMove=null;
function tok(s){ return s.z+(s.min!=null? s.min+"m" : s.km); }
function stepsDsl(steps){ return steps.map(function(st){ var it=st.items.map(tok).join(" "); return st.n>1? st.n+"x["+it+"]" : it; }).join(" "); }
function propose(w,s,feel){
  if(feel==="ok") return {info:"Volg het plan zoals het staat."};
  var km=s.p?sumKm(s.p.segs):0, mins=s.p?sumMin(s.p.segs):0, quality=s.id==="di_run"&&s.type!=="E"&&W[w].k!=="race";
  var REST={type:"rest",tag:"Rust",title:"Rustdag",note:"Neem rust. Een gemiste sessie maakt geen verschil, doorduwen op een slechte dag wel. Schuif kwaliteit hooguit 1 dag op en plan nooit 2 zware dagen na elkaar."};
  if(s.gym){
    if(feel==="top") return {info:"Volg het plan. Voel je je sterk, dan mag de laatste set squat en bench iets zwaarder."};
    if(feel==="moe") return {type:"gym",tag:"Fitness · kort",title:"Workout "+s.gym+" · kort",note:"Alleen de hoofdoefeningen, 2 sets per oefening op RPE 6. Plyo overslaan. ±40 min."};
    if(feel==="kapot") return {type:"rest",tag:"Rust",title:"Geen gym vandaag",note:"Sla deze sessie over. 10 minuten mobiliteit thuis is genoeg."};
    return {type:"gym",tag:"Fitness · aangepast",title:"Bovenlichaam + core",note:"Geen plyo, squats of lunges. Wel bench press, pull-ups of lat pulldown en de core-oefeningen. Doet een oefening pijn: stop ermee."};
  }
  if(s.type==="bike"){
    if(feel==="top") return {info:"Volg het plan. Hou het op duurtempo, zondag telt meer."};
    if(feel==="moe") return s.bkm?{type:"bike",tag:"Fiets · korter",title:Math.round(s.bkm*0.6)+" km fietsen",bkm:Math.round(s.bkm*0.6),note:"Kortere rit op praattempo."}:{info:"Hou het bij 20 minuten heel rustig, of rust."};
    if(feel==="kapot") return REST;
    return {info:"Fietsen is meestal pijnvrij bij loopblessures. Doet het fietsen zelf pijn, stop dan en neem rust."};
  }
  if(!s.p) return {info:"Volg het plan."};
  if(W[w].k==="race"&&s.id==="zo_long") return {info:feel==="pijn"?"Twijfel je om te starten met pijn, laat het eerst checken door je kinesist.":"Spanning en zware benen in de raceweek zijn normaal. Start bewust trager dan marathontempo."};
  if(feel==="top"){
    if(quality) return {info:"Volg het plan. De laatste herhaling mag aan de snelle kant van je zone, maar voeg geen extra herhalingen toe."};
    if(s.type==="TT") return {info:"Perfecte dag voor een PR. Hou je aan het plan: eerste km op 4:35."};
    if(s.id==="zo_long") return {info:"Volg het plan. Hou de rustige km echt rustig, ook als het makkelijk voelt."};
    return {info:"Rustig blijft rustig (6:00–6:40/km). Je mag 4 strides van 20 s toevoegen op het einde."};
  }
  if(feel==="pijn"){ var bm=Math.max(30,Math.round(mins/5)*5); return {type:"bike",tag:"Fiets i.p.v. lopen",title:bm+" min rustig fietsen",bmin:bm,note:"Niet lopen met pijn. Fiets dezelfde tijd op praattempo als dat pijnvrij is. Blijft de pijn langer dan 3 dagen, laat het checken."}; }
  if(feel==="kapot"){ if(s.id==="zo_long") return Object.assign({},REST,{note:"Sla de long run over. Voel je je maandag beter, loop dan hooguit 40 minuten rustig, geen inhaalduurloop."}); return REST; }
  // moe
  if(s.type==="TT") return {type:"E",tag:"Easy",title:"5 km rustig",dsl:"E5",note:"Geen PR-poging op vermoeide benen. Verplaats de time trial naar volgende zaterdag."};
  if(quality){
    var st=s.p.steps.map(function(x){ if(x.n>1) return {n:Math.max(2,Math.ceil(x.n*0.6)),items:x.items}; var i=x.items[0]; if(i.z==="E") return x; return {n:1,items:[i.min!=null?{z:i.z,min:Math.round(i.min*0.6)}:{z:i.z,km:Math.round(i.km*0.6*10)/10}]}; });
    return {type:s.type,tag:s.tag+" · ingekort",title:"Kortere "+s.tag.toLowerCase(),dsl:stepsDsl(st),note:"Minder herhalingen, aan de trage kant van je zone. Voelt de eerste herhaling zwaar, maak er dan een rustige loop van."};
  }
  if(s.id==="zo_long"){ var lk=Math.round(km*0.75); return {type:"long",tag:"Long run · ingekort",title:lk+" km rustig",dsl:"E"+lk,note:"Kortere duurloop zonder tempoblokken. Tijd op je benen is vandaag belangrijker dan tempo."}; }
  var ek=Math.max(4,Math.round(km*0.7)); return {type:"E",tag:"Easy · korter",title:ek+" km rustig",dsl:"E"+ek,note:"Korter en heel rustig. Fietsen mag ook."};
}
function openSheet(w,id,keepFocus){
  var f=findSess(w,id); if(!f) return; sheetRef={w:w,id:id};
  var s=effSess(w,f.s), done=!!weekState(w).done[id], c=color(s), h='<div class="grab"></div><button class="x" type="button" data-close="1" aria-label="Sluiten">×</button>';
  h+='<div style="padding-right:48px;display:flex;flex-direction:column;gap:4px"><span class="eyebrow" style="color:'+c+'">'+s.tag+'</span><h2 style="font-size:26px">'+s.title+'</h2><span class="small muted">'+DAYS[f.d]+' '+dstr(dateOf(w,f.d))+' · week '+(w+1)+'</span></div>'+facts(s);
  if(s.p){
    h+=viz(s.p.segs);
    h+='<ul class="steps">'+s.p.steps.map(function(st){
      var it=st.items, main=it[0];
      var txt=(st.n>1?st.n+" × ":"")+it.map(function(x){ return dist(x)+" "+ZN[x.z].toLowerCase(); }).join(" + ");
      return '<li><i style="background:'+ZC[main.z]+'"></i><span>'+txt+'</span><b>'+paceTxt(main.z)+'</b></li>';
    }).join("")+'</ul>';
  }
  if(s.note) h+='<div class="card" style="background:var(--card2)"><span class="small">'+s.note+'</span></div>';
  if(s.orig) h+='<div class="modban"><span>Aangepast omdat je je '+FEELW[s.feel]+' voelde.</span><button type="button" data-restore="'+w+'|'+id+'">Origineel terug</button></div>';
  if(!done){
    h+='<div class="feel"><div class="eyebrow">Hoe voel je je vandaag?</div><div class="feelrow" role="group">'+FEELS.map(function(fl){ return '<button type="button" data-feel="'+fl[0]+'" aria-pressed="'+(sheetFeel===fl[0])+'">'+fl[1]+'</button>'; }).join("")+'</div></div>';
    if(sheetFeel){ var pr=propose(w,f.s,sheetFeel);
      if(pr.info) h+='<div class="prop info"><span class="small">'+pr.info+'</span></div>';
      else { var pp=pr.dsl?parse(pr.dsl):null;
        h+='<div class="prop"><div class="eyebrow" style="color:var(--primary)">Voorstel</div><h3 style="font-size:20px">'+pr.title+'</h3>'+(pp?facts({p:pp})+viz(pp.segs,"sm"):(pr.bmin||pr.bkm?facts(pr):""))+'<span class="small muted">'+pr.note+'</span><button type="button" class="btn ghost" data-apply="'+w+'|'+id+'">Pas workout aan</button></div>'; }
    }
  }
  var lg=weekState(w).log[id];
  if(done && s.type!=="rest") h+=logForm(w,id,s);
  else if(lg) h+='<div class="small muted">Log: '+logLine(w,s,lg)+'</div>';
  if(!done && W[w].k!=="race"){
    var cur=f.d;
    h+='<div class="feel"><div class="eyebrow">Verplaats naar een andere dag</div><div class="daypick" role="group">'+DS.map(function(x,di){ return '<button type="button" data-mvpick="'+di+'" aria-pressed="'+((sheetMove!=null?sheetMove:cur)===di)+'" aria-label="'+DAYS[di]+'">'+x+'<small>'+dateOf(w,di).getDate()+'</small></button>'; }).join("")+'</div></div>';
    if(sheetMove!=null && sheetMove!==cur){ var wn=moveWarn(w,id,sheetMove);
      h+='<div class="prop'+(wn?"":" info")+'">'+(wn?'<span class="small" style="color:var(--zT)">Let op: '+wn+'</span>':'<span class="small">Prima dag, geen botsing met andere zware sessies.</span>')+'<button type="button" class="btn ghost" data-domove="'+w+'|'+id+'">Verplaats naar '+DAYS[sheetMove].toLowerCase()+'</button></div>'; }
    if(f.s.from!=null) h+='<div class="modban"><span>Verplaatst van '+DAYS[f.s.from].toLowerCase()+'.</span><button type="button" data-unmove="'+w+'|'+id+'">Terugzetten</button></div>';
  }
  if(s.gym) h+='<button class="btn ghost" data-gotogym="'+s.gym+'">Bekijk oefeningen</button>';
  h+='<button class="btn" data-chk="'+w+'|'+id+'">'+(done?"Markeer als niet gedaan":"Markeer als gedaan")+'</button>';
  var sh=document.getElementById("sheet"); sh.innerHTML=h; sh.hidden=false; document.getElementById("scrim").hidden=false;
  if(!keepFocus){ var b=sh.querySelector(".btn:last-child"); if(b) b.focus(); }
}
function closeSheet(){ sheetRef=null; sheetFeel=null; sheetMove=null; document.getElementById("sheet").hidden=true; document.getElementById("scrim").hidden=true; }

// ---------- render + events ----------
function render(){
  var app=document.getElementById("app");
  app.innerHTML = tab==="today"?screenToday():tab==="plan"?screenPlan():tab==="gym"?screenGym():tab==="guide"?screenGuide():screenStats();
  Array.prototype.forEach.call(document.querySelectorAll("#tabs button"),function(b){ b.setAttribute("aria-selected",String(b.dataset.tab===tab)); });
  if(tab==="plan"){ var c=document.querySelector('.wchip[aria-current="true"]'); if(c) c.scrollIntoView({inline:"center",block:"nearest"}); }
  var gs=document.getElementById("goalSel"); if(gs) gs.onchange=function(){ saveGoal(+gs.value); };
  if(sheetRef) openSheet(sheetRef.w,sheetRef.id,true);
  checkBadges(metrics());
  try{ localStorage.setItem("gent_tab",tab); }catch(e){}
}
document.addEventListener("click",function(e){
  var t=e.target.closest("[data-chk],[data-open],[data-tab],[data-week],[data-easy],[data-gym],[data-gotogym],[data-day],[data-close],[data-feel],[data-apply],[data-restore],[data-mvpick],[data-domove],[data-unmove],[data-savelog],[data-energy],[data-savedaily],[data-editdaily],[data-export],[data-copyexp],[data-importtxt],[data-mob],[data-mobclose],[data-mobpause],[data-mobskip],[data-ics],[data-share],[data-jump],#scrim");
  if(!t) return;
  if(t.id==="scrim"||t.dataset.close){ closeSheet(); return; }
  if(t.dataset.chk){ e.stopPropagation(); var p=t.dataset.chk.split("|"); toggle(+p[0],p[1]); return; }
  if(t.dataset.open){ var q=t.dataset.open.split("|"); openSheet(+q[0],q[1]); return; }

  if(t.dataset.week){ curSelW=+t.dataset.week; render(); return; }
  if(t.dataset.easy){ var r=t.dataset.easy.split("|"); setEasy(+r[0],r[1]); return; }

  if(t.dataset.restore){ var rs=t.dataset.restore.split("|"); sheetFeel=null; setMod(+rs[0],rs[1],null); return; }
  if(t.dataset.mvpick){ sheetMove=+t.dataset.mvpick; openSheet(sheetRef.w,sheetRef.id,true); return; }
  if(t.dataset.domove){ var mvp=t.dataset.domove.split("|"), mo=cloneWS(weekState(+mvp[0])), fs2=findSess(+mvp[0],mvp[1]), orig=fs2.s.from!=null?fs2.s.from:fs2.d; if(sheetMove===orig) delete mo.move[mvp[1]]; else mo.move[mvp[1]]=sheetMove; sheetMove=null; saveWeek(+mvp[0],mo); return; }
  if(t.dataset.unmove){ var um=t.dataset.unmove.split("|"), uo=cloneWS(weekState(+um[0])); delete uo.move[um[1]]; sheetMove=null; saveWeek(+um[0],uo); return; }
  if(t.dataset.savelog){ var sl=t.dataset.savelog.split("|"), lo=cloneWS(weekState(+sl[0])), g=function(i){ var el=document.getElementById(i); return el?el.value:""; }, rec={};
    var kmv=parseFloat(g("lgKm").replace(",",".")); if(!isNaN(kmv)) rec.km=kmv;
    var bls=[], anyb=false; for(var bi=0;bi<12;bi++){ var be=document.getElementById("lgB"+bi); if(!be) break; var pv=parseTime(be.value); bls.push(pv||0); if(pv) anyb=true; } if(anyb) rec.blocks=bls; var sec=parseTime(g("lgTime")); if(sec) rec.sec=sec; if(g("lgRpe")) rec.rpe=+g("lgRpe"); var nt=g("lgNote").trim(); if(nt) rec.note=nt;
    var gl=parseInt(g("lgGels"),10); if(!isNaN(gl)) rec.gels=gl; var gk=g("lgGelKm").trim(); if(gk) rec.gelKm=gk; if(g("lgGut")) rec.gut=g("lgGut");
    if(Object.keys(rec).length) lo.log[sl[1]]=rec; else delete lo.log[sl[1]]; saveWeek(+sl[0],lo); return; }
  if(t.dataset.energy){ Array.prototype.forEach.call(t.parentNode.children,function(b){ b.setAttribute("aria-pressed",String(b===t)); }); return; }
  if(t.dataset.savedaily){ var en=document.querySelector("[data-energy][aria-pressed=true]"), pn=document.getElementById("dPain").value; editDaily=false;
    saveDaily(dkey(today),{sleep:+document.getElementById("dSleep").value,energy:en?+en.dataset.energy:3,pain:pn,score:pn==="Geen"?0:+document.getElementById("dScore").value}); return; }
  if(t.dataset.editdaily){ editDaily=true; render(); return; }
  if(t.dataset.export){ saveFile("gent42-backup-"+dkey(today)+".json",backupJSON(),"application/json").catch(function(){ exportShown=true; render(); }); return; }
  if(t.dataset.copyexp){ var tx=document.getElementById("expTxt"); var done2=function(){ t.textContent="Gekopieerd"; }; if(navigator.clipboard) navigator.clipboard.writeText(tx.value).then(done2,function(){ tx.select(); }); else tx.select(); return; }
  if(t.dataset.importtxt){ if(!importArmed){ importArmed=true; t.textContent="Tik nogmaals: huidige data overschrijven"; return; } var err=doImport(document.getElementById("impTxt").value); importArmed=false; if(err){ document.getElementById("impMsg").textContent=err; return; } render(); document.getElementById("impMsg").textContent="Back-up teruggezet."; return; }
  if(t.dataset.jump){ e.preventDefault(); var jt=document.getElementById(t.dataset.jump); if(jt) jt.scrollIntoView({behavior:"smooth",block:"start"}); return; }
  if(t.dataset.mob){ mobStart(t.dataset.mob); return; }
  if(t.dataset.mobclose){ mobClose(); return; }
  if(t.dataset.mobpause){ mobRun.paused=!mobRun.paused; mobDraw(); return; }
  if(t.dataset.mobskip){ mobNext(); return; }
  if(t.dataset.ics){ var wk=document.getElementById("calWk").value, we=document.getElementById("calWe").value; try{ localStorage.setItem("gent_cal_wk",wk); localStorage.setItem("gent_cal_we",we); }catch(err){}
    saveFile("gent42-trainingen.ics",buildICS(wk,we),"text/calendar").then(function(){ calMsg="Agendabestand gemaakt. Open het om de sessies toe te voegen."; render(); }); return; }
  if(t.dataset.share){ doShare(t.dataset.share,+(t.dataset.sw||0)); return; }
  if(t.dataset.gotogym){ gymSel=t.dataset.gotogym; tab="gym"; closeSheet(); render(); window.scrollTo(0,0); return; }
  if(t.dataset.day){ var dd=t.dataset.day.split("|"); curSelW=+dd[0]; tab="plan"; render(); window.scrollTo(0,0); }
});
document.addEventListener("change",function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.lift){ var v=parseFloat(String(t.value).replace(",",".")), L=state.lifts[t.dataset.lift]||{}; if(isNaN(v)) delete L[key(curSelW)]; else L[key(curSelW)]=v; state.lifts[t.dataset.lift]=L; saveLifts(); render(); }
  if(t.id==="impFile"&&t.files&&t.files[0]){ var rd=new FileReader(); rd.onload=function(){ var err=doImport(String(rd.result)); render(); var mm=document.getElementById("impMsg"); if(mm) mm.textContent=err||"Back-up teruggezet."; }; rd.readAsText(t.files[0]); }
});
document.addEventListener("keydown",function(e){
  if(e.key==="Escape") closeSheet();
  if((e.key==="Enter"||e.key===" ") && e.target.dataset && e.target.dataset.open){ e.preventDefault(); var q=e.target.dataset.open.split("|"); openSheet(+q[0],q[1]); }
});

var local=lsGet(); if(local){ state.weeks=local.weeks||{}; state.lifts=local.lifts||{}; state.daily=local.daily||{}; state.mob=local.mob||{}; if(local.goal) goalSec=local.goal; }
statusTxt="Opgeslagen op dit toestel";
render();
loadWx();
if("serviceWorker" in navigator){ window.addEventListener("load",function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); }); }
})();
</script>
